name: bloc_effects_test
description: >-
  A testing library for bloc_effects that extends bloc_test with the ability
  to assert on side effects emitted by BlocWithEffects and CubitWithEffects.
version: 1.0.0
repository: https://github.com/DartAndrik/bloc_effects_test
issue_tracker: https://github.com/DartAndrik/bloc_effects_test/issues
topics: [bloc, state-management, test, bloc-effects]

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  bloc: ^9.2.1
  bloc_effects: ^2.0.1
  bloc_test: ^10.0.0
  meta: ^1.3.0
  test: ^1.16.0

